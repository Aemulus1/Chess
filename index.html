function attacked(b,r,c,by){for(let y=0;y<8;y++)for(let x=0;x<8;x++){let p=b[y][x];if(!p||p.c!==by)continue;let dr=r-y,dc=c-x,ar=Math.abs(dr),ac=Math.abs(dc);if(p.t==='p'&&dr===(by==='w'?-1:1)&&ac===1)return true;if(p.t==='n'&&((ar===2&&ac===1)||(ar===1&&ac===2)))return true;if(p.t==='k'&&Math.max(ar,ac)===1)return true;if(['b','r','q'].includes(p.t)){let diag=ar===ac&&ar>0,straight=(dr===0||dc===0)&&(ar+ac>0);if(!((p.t==='b'&&diag)||(p.t==='r'&&straight)||(p.t==='q'&&(diag||straight))))continue;let sy=Math.sign(dr),sx=Math.sign(dc),yy=y+sy,xx=x+sx,clear=true;while(yy!==r||xx!==c){if(b[yy][xx]){clear=false;break}yy+=sy;xx+=sx}if(clear)return true}}return false}
