n{display:none;background:#20353b;padding:10px;border-radius:10px;margin:8px}/* Stukken absoluut binnen hun eigen vierkant: geen invloed op grid-rijhoogte. */
.sq .piece{position:absolute!important;inset:auto!important;left:50%!important;top:50%!important;transform:translate(-50%,-50%)!important;width:49%!important;height:73%!important;max-width:none!important;max-height:none!important;min-width:0!important;min-height:0!important;display:block!important;overflow:visible!important}
.sq .piece:has(img[alt="k"]){width:51%!important;height:76%!important}
.sq .piece:has(img[alt="q"]){width:50%!important;height:74%!important}
.sq .piece img{width:100%!important;height:100%!important;object-fit:contain!important;display:block!important}

.sq .coord{position:absolute;z-index:3;font-size:clamp(9px,1.45vw,12px);font-weight:700;line-height:1;pointer-events:none;user-select:none;opacity:.88}
.sq .rank-label{top:4px;left:4px}
.sq .file-label{bottom:4px;right:4px}
.sq.light .coord{color:#694b35}.sq.dark .coord{color:#f6e5c9}

function record(){let key=JSON.stringify([board,turn,castle,ep]);seen.set(key,(seen.get(key)||0)+1);return seen.get(key)}
function insufficient(){let pcs=board.flat().filter(p=>p&&p.t!=='k');if(!pcs.length)return true;if(pcs.length===1&&['b','n'].includes(pcs[0].t))return true;return false}
function finishMove(){turn=other(turn);let reps=record();if(!anyMoves(turn)){finished=true;document.getElementById('status').textContent=inCheck(board,turn)?'Schaakmat! '+(turn==='w'?'Zwart':'Wit')+' wint.':'Pat! Gelijkspel.'}else if(insufficient()||halfmove>=150||reps>=5){finished=true;document.getElementById('status').textContent='Remise — '+(insufficient()?'onvoldoende materiaal':halfmove>=150?'75-zettenregel':'vijfvoudige herhaling')}else if(halfmove>=100||reps>=3){document.getElementById('claim').style.display='inline-block'}}


// De AI gebruikt exact dezelfde legale zetten en zetuitvoering als de speler.
const aiValues={p:100,n:320,b:335,r:500,q:900,k:20000};
function aiCandidates(b,color,rights,epTarget){
 const oldBoard=board,oldCastle=castle,oldEp=ep;board=b;castle=rights;ep=epTarget;
 let out=[];try{for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(b[r][c]?.c===color){for(let m of legal(r,c))out.push({r,c,m,p:b[r][c],victim:m.special==='ep'?b[r][m.c]:b[m.r][m.c]})}}finally{board=oldBoard;castle=oldCastle;ep=oldEp}return out;
}
function aiTransition(b,rights,epTarget,a){
 let b2=apply(b,a.r,a.c,a.m);let cr={w:{...rights.w},b:{...rights.b}};let p=a.p;
 if(p.t==='k'){cr[p.c].k=false;cr[p.c].q=false}
 if(p.t==='r'&&a.r===(p.c==='w'?7:0)){if(a.c===0)cr[p.c].q=false;if(a.c===7)cr[p.c].k=false}
 if(a.victim?.t==='r'&&a.m.r===(a.victim.c==='w'?7:0)){if(a.m.c===0)cr[a.victim.c].q=false;if(a.m.c===7)cr[a.victim.c].k=false}
 if(p.t==='p'&&(a.m.r===0||a.m.r===7))b2[a.m.r][a.m.c].t='q';
 return {b:b2,rights:cr,epTarget:a.m.special==='double'?{r:(a.r+a.m.r)/2,c:a.c}:null};
}
function aiScore(b){let score=0;for(let r=0;r<8;r++)for(let c=0;c<8;c++){let p=b[r][c];if(!p)continue;let val=aiValues[p.t];if(p.t==='p')val+=(p.c==='b'?r:7-r)*8;if(['n','b'].includes(p.t))val+=(3.5-Math.abs(3.5-c))*6+(3.5-Math.abs(3.5-r))*5;score+=(p.c==='b'?1:-1)*val}return score}
function aiSearch(b,rights,epTarget,color,depth,alpha,beta){
 let candidates=aiCandidates(b,color,rights,epTarget);
 if(!candidates.length)return inCheck(b,color)?(color==='b'?-100000-depth:100000+depth):0;
 if(depth===0)return aiScore(b);
 candidates.sort((a,z)=>(z.victim?aiValues[z.victim.t]:0)-(a.victim?aiValues[a.victim.t]:0));
 if(color==='b'){let best=-Infinity;for(let a of candidates){let t=aiTransition(b,rights,epTarget,a);best=Math.max(best,aiSearch(t.b,t.rights,t.epTarget,'w',depth-1,alpha,beta));alpha=Math.max(alpha,best);if(beta<=alpha)break}return best}
 let best=Infinity;for(let a of candidates){let t=aiTransition(b,rights,epTarget,a);best=Math.min(best,aiSearch(t.b,t.rights,t.epTarget,'b',depth-1,alpha,beta));beta=Math.min(beta,best);if(beta<=alpha)break}return best;
}
function chooseAI(){let candidates=aiCandidates(board,'b',castle,ep);if(!candidates.length)return null;
 const level=Number(document.getElementById('ai-level').value);
 if(level===0)return candidates[Math.floor(Math.random()*candidates.length)];
 candidates.sort((a,z)=>(z.victim?aiValues[z.victim.t]:0)-(a.victim?aiValues[a.victim.t]:0));
 let rated=candidates.map(a=>{let t=aiTransition(board,castle,ep,a);return {a,score:aiSearch(t.b,t.rights,t.epTarget,'w',level===1?0:level===2?2:3,-Infinity,Infinity)+(Math.random()-.5)*(level===1?150:level===2?25:3)}});
 rated.sort((x,y)=>y.score-x.score);
 if(level===1&&rated.length>1)return rated[Math.floor(Math.random()*Math.min(3,rated.length))].a;
 return rated[0].a;
}
function scheduleAI(){if(!aiMode()||turn!=='b'||finished||pending||aiBusy)return;aiBusy=true;const generation=aiGeneration;document.getElementById('status').textContent='AI denkt…';setTimeout(()=>{if(generation!==aiGeneration||!aiMode()||turn!=='b'||finished){aiBusy=false;return}try{let a=chooseAI();if(!a){aiBusy=false;return}selected={r:a.r,c:a.c};moves=legal(a.r,a.c);aiBusy=false;aiActing=true;click(a.m.r,a.m.c);aiActing=false;if(pending){board[pending.r][pending.c].t='q';pending=null;document.getElementById('promotion').style.display='none';finishMove();render(lastMove)}}catch(err){aiBusy=false;document.getElementById('status').textContent='AI-fout: '+err.message;console.error(err)}},80)}
document.getElementById('game-mode').addEventListener('change',init);
document.getElementById('ai-level').addEventListener('change',()=>{if(aiMode()&&turn==='b')scheduleAI()});

document.querySelectorAll('[data-prom]').forEach(b=>b.onclick=()=>{if(!pending)return;board[pending.r][pending.c].t=b.dataset.prom;pending=null;document.getElementById('promotion').style.display='none';finishMove();render(lastMove);scheduleAI()});document.getElementById('claim').onclick=()=>{if(!finished){finished=true;document.getElementById('status').textContent='Remise geclaimd';document.getElementById('claim').style.display='none'}};document.getElementById('reset').onclick=()=>{document.getElementById('claim').style.display='none';init()};init();
</script></html>
